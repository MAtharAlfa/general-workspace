<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pemweb 2026</title>
    <style>
      
    </style>
  </head>

  <body>
    <div class="nav-inner">
      <nav>
        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">About</a></li>
        </ul>
      </nav>
    </div>
    <header>
      <div class="global-wrapper">
        <h1 class="title">Restoran Kren</h1>
        <h2 class="sub-title">Pendaftaran Member Baru!!</h2>
        <h2>Gaji Rp.100 juta</h2>
      </div>
    </header>
    <main>
      <div class="global-wrapper">
        <h2>Form Pendaftaran Member Baru</h2>
        <form>
          <section id="name-input">
            <label for="fname">First Name:</label>
            <input type="text" name="fname" id="fname" /><br />
            <br />

            <label for="lname">Last Name:</label>
            <input type="text" name="lname" id="lname" />
            <br />
          </section>

          <label for="position">Position: </label>
          <select name="position" id="position">
            <option value="chef">Chef</option>
            <option value="customer_support">Customer Support</option>
            <option value="waiter">Waiter</option>
            <option value="manager">Manager</option>
          </select>
          <br />

          <label for="experience">Experience: </label>
          <br />

          <textarea
            id="experience"
            name="experience"
            rows="2"
            cols="30"
          ></textarea>
          <br />

          <label for="commited">I'm commited:</label>
          <input type="checkbox" name="commited" id="commited" />
          <br />

          <label for="cv">Insert CV:</label>
          <input type="file" name="cv" id="cv" />
          <br />
        </form>
      </div>
    </main>
    <footer class="footer">
      <h6>Contact: 08123456789</h6>
    </footer>
  </body>
</html>
